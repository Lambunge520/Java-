name: Build LJM headless packages

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: false
        default: "v2.8"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Windows exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_headless_windows.ps1
      - name: Pack Windows artifact
        shell: pwsh
        run: Compress-Archive -Path dist\LJM-Java-Manager-headless.exe -DestinationPath LJM-Java-Manager-headless-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-headless-windows
          path: LJM-Java-Manager-headless-windows.zip

  linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y python3 python3-pip python3-tk binutils
          ldd --version
      - name: Install build tools
        run: python3 -m pip install --upgrade "pip<25" "setuptools<76" wheel "pyinstaller<7"
      - name: Build Linux binary
        run: chmod +x ./scripts/build_headless_linux.sh && ./scripts/build_headless_linux.sh
      - name: Pack Linux artifact
        run: tar -czf LJM-Java-Manager-headless-linux.tar.gz -C dist LJM-Java-Manager-headless
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-headless-linux
          path: LJM-Java-Manager-headless-linux.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build macOS binary
        run: chmod +x ./scripts/build_headless_macos.sh && ./scripts/build_headless_macos.sh
      - name: Pack macOS artifact
        run: ditto -c -k --sequesterRsrc --keepParent dist/LJM-Java-Manager-headless LJM-Java-Manager-headless-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-headless-macos
          path: LJM-Java-Manager-headless-macos.zip

  release:
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare checksums
        run: |
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS-headless.txt
          cat SHA256SUMS-headless.txt
      - name: Create or update GitHub Release
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "LJM Java Manager $RELEASE_TAG" --notes-file docs/releases/RELEASE_NOTES_2.8.md || true
          gh release edit "$RELEASE_TAG" --title "LJM Java Manager $RELEASE_TAG" --notes-file docs/releases/RELEASE_NOTES_2.8.md
          gh release upload "$RELEASE_TAG" \
            release-assets/LJM-Java-Manager-headless-windows/LJM-Java-Manager-headless-windows.zip \
            release-assets/LJM-Java-Manager-headless-linux/LJM-Java-Manager-headless-linux.tar.gz \
            release-assets/LJM-Java-Manager-headless-macos/LJM-Java-Manager-headless-macos.zip \
            SHA256SUMS-headless.txt \
            --clobber
