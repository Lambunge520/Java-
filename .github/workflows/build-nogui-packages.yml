name: Build LJM nogui packages

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: false
        default: "v3.1.2"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Windows exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_nogui_windows.ps1
      - name: Pack Windows artifact
        shell: pwsh
        run: Compress-Archive -Path dist\LJM-Java-Manager-nogui.exe -DestinationPath LJM-Java-Manager-nogui-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-nogui-windows
          path: LJM-Java-Manager-nogui-windows.zip

  linux:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          apt-get update
          apt-get install -y python3 python3-pip python3-tk binutils
          ldd --version
      - name: Install build tools
        run: python3 -m pip install --upgrade "pip<25" "setuptools<76" wheel "pyinstaller<7"
      - name: Build Linux binary
        run: chmod +x ./scripts/build_nogui_linux.sh && ./scripts/build_nogui_linux.sh
      - name: Pack Linux artifact
        run: chmod +x dist/LJM-Java-Manager-nogui dist/LJM-Java-Manager-nogui.run && tar -czf LJM-Java-Manager-nogui-linux.tar.gz -C dist LJM-Java-Manager-nogui.run LJM-Java-Manager-nogui
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-nogui-linux
          path: LJM-Java-Manager-nogui-linux.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build macOS binary
        run: chmod +x ./scripts/build_nogui_macos.sh && ./scripts/build_nogui_macos.sh
      - name: Pack macOS artifact
        run: |
          chmod +x dist/LJM-Java-Manager-nogui dist/LJM-Java-Manager-nogui.command
          mkdir -p dist/LJM-Java-Manager-nogui-macos
          cp dist/LJM-Java-Manager-nogui dist/LJM-Java-Manager-nogui.command dist/LJM-Java-Manager-nogui-macos/
          ditto -c -k --sequesterRsrc --keepParent dist/LJM-Java-Manager-nogui-macos LJM-Java-Manager-nogui-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-nogui-macos
          path: LJM-Java-Manager-nogui-macos.zip

  release:
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare Python source package
        run: |
          mkdir -p release-assets/python-source
          chmod +x src/LJM_nogui nogui/LJM_nogui
          zip -r release-assets/python-source/LJM-Java-Manager-nogui-python-source.zip \
            src/LJM.pyw \
            src/LJM_nogui.pyw \
            src/LJM_nogui.py \
            src/LJM_nogui \
            src/LJM_nogui_entry.py \
            nogui/LJM.pyw \
            nogui/LJM_nogui.pyw \
            nogui/LJM_nogui.py \
            nogui/LJM_nogui \
            nogui/LJM_nogui_entry.py
      - name: Prepare checksums
        run: |
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS-nogui.txt
          cat SHA256SUMS-nogui.txt
      - name: Create or update GitHub Release
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_NOTES_FILE="docs/releases/RELEASE_NOTES_${RELEASE_VERSION}.md"
          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            RELEASE_NOTES_FILE="docs/releases/RELEASE_NOTES_TEMPLATE_BILINGUAL.md"
          fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "LJM Java Manager $RELEASE_TAG" --notes-file "$RELEASE_NOTES_FILE" || true
          gh release edit "$RELEASE_TAG" --title "LJM Java Manager $RELEASE_TAG" --notes-file "$RELEASE_NOTES_FILE"
          gh release upload "$RELEASE_TAG" \
            release-assets/LJM-Java-Manager-nogui-windows/LJM-Java-Manager-nogui-windows.zip \
            release-assets/LJM-Java-Manager-nogui-linux/LJM-Java-Manager-nogui-linux.tar.gz \
            release-assets/LJM-Java-Manager-nogui-macos/LJM-Java-Manager-nogui-macos.zip \
            release-assets/python-source/LJM-Java-Manager-nogui-python-source.zip \
            SHA256SUMS-nogui.txt \
            --clobber
