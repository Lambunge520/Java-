name: Build LJM packages

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: false
        default: "v3.1.3"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Windows exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\build_windows.ps1
      - name: Pack Windows artifact
        shell: pwsh
        run: Compress-Archive -Path dist\LJM-Java-Manager.exe -DestinationPath LJM-Java-Manager-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-windows
          path: LJM-Java-Manager-windows.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Linux binary
        run: chmod +x ./scripts/build_linux.sh && ./scripts/build_linux.sh
      - name: Pack Linux artifact
        run: chmod +x dist/LJM-Java-Manager dist/LJM-Java-Manager.run && tar -czf LJM-Java-Manager-linux.tar.gz -C dist LJM-Java-Manager.run LJM-Java-Manager linux-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-linux
          path: LJM-Java-Manager-linux.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build macOS app
        run: chmod +x ./scripts/build_macos.sh && ./scripts/build_macos.sh
      - name: Pack macOS artifact
        run: chmod +x dist/LJM-Java-Manager.app/Contents/MacOS/LJM-Java-Manager && ditto -c -k --sequesterRsrc --keepParent dist/LJM-Java-Manager.app LJM-Java-Manager-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-macos
          path: LJM-Java-Manager-macos.zip

  release:
    runs-on: ubuntu-latest
    needs: [windows, linux, macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare checksums
        run: |
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS-gui.txt
          cat SHA256SUMS-gui.txt
      - name: Create or update GitHub Release
        run: |
          RELEASE_VERSION="${RELEASE_TAG#v}"
          RELEASE_NOTES_FILE="docs/releases/RELEASE_NOTES_${RELEASE_VERSION}.md"
          if [ ! -f "$RELEASE_NOTES_FILE" ]; then
            RELEASE_NOTES_FILE="docs/releases/RELEASE_NOTES_TEMPLATE_BILINGUAL.md"
          fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "LJM Java Manager $RELEASE_TAG" --notes-file "$RELEASE_NOTES_FILE" || true
          gh release edit "$RELEASE_TAG" --title "LJM Java Manager $RELEASE_TAG" --notes-file "$RELEASE_NOTES_FILE"
          gh release upload "$RELEASE_TAG" \
            release-assets/LJM-Java-Manager-windows/LJM-Java-Manager-windows.zip \
            release-assets/LJM-Java-Manager-linux/LJM-Java-Manager-linux.tar.gz \
            release-assets/LJM-Java-Manager-macos/LJM-Java-Manager-macos.zip \
            SHA256SUMS-gui.txt \
            --clobber
