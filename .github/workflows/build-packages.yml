name: Build LJM packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Windows exe
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-windows
          path: dist/LJM-Java-Manager.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build Linux binary
        run: chmod +x ./build_linux.sh && ./build_linux.sh
      - name: Pack Linux artifact
        run: tar -czf LJM-Java-Manager-linux.tar.gz -C dist LJM-Java-Manager linux-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-linux
          path: LJM-Java-Manager-linux.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build macOS app
        run: chmod +x ./build_macos.sh && ./build_macos.sh
      - name: Pack macOS artifact
        run: ditto -c -k --sequesterRsrc --keepParent dist/LJM-Java-Manager.app LJM-Java-Manager-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LJM-Java-Manager-macos
          path: LJM-Java-Manager-macos.zip
